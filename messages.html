<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahir Elite | Messages</title><style>:root{color-scheme:dark;--bg:#07110f;--panel:#10201c;--line:#254139;--accent:#00c896;--text:#eefaf5;--muted:#9bb5ab}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(24px,4vw,36px)}a,button{color:var(--text);background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:10px;text-decoration:none;cursor:pointer}a:hover,button:hover{border-color:var(--accent)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.tools input,.tools select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:9px;min-width:160px}.list{display:grid;gap:12px}.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.meta{color:var(--muted);font-size:13px}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:30px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.unread{border-color:var(--accent)}</style></head><body>
<nav class="portfolio-tools" style="position:sticky;top:0;z-index:999;background:#101010;border-bottom:1px solid #333;padding:12px 18px;display:flex;gap:16px;flex-wrap:wrap"><a href="index.html" style="color:#fff">← Portfolio</a><a href="admin-dashboard.html" style="color:#df2531">Admin Dashboard</a><a href="portfolio-manager.html" style="color:#fff">Project Manager</a><a href="messages.html" style="color:#fff">Messages Inbox</a></nav><main class="wrap"><header><div><h1>Messages Inbox</h1><p class="meta">Messages saved in this browser only.</p></div><nav><a href="index.html">Portfolio</a> <a href="admin-dashboard.html">Admin</a> <a href="portfolio-manager.html">Projects</a></nav></header><div class="tools"><input id="search" placeholder="Search messages…"><select id="filter"><option value="all">All messages</option><option value="unread">Unread</option><option value="read">Read</option></select><button id="export">Export JSON</button><button id="clear">Clear all</button></div><div id="list" class="list"></div></main><script>
const KEY='mahirEliteMessages';const $=id=>document.getElementById(id);let messages=[];try{messages=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(messages))messages=[]}catch(e){messages=[]}function save(){localStorage.setItem(KEY,JSON.stringify(messages));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const filtered=messages.filter(m=>{const read=!!m.read;return(f==='all'||(f==='read'&&read)||(f==='unread'&&!read))&&JSON.stringify(m).toLowerCase().includes(q)});$('list').innerHTML=filtered.length?filtered.map(m=>`<article class="item ${m.read?'':'unread'}"><strong>${esc(m.name||'Visitor')}</strong> <span class="meta">${esc(m.email||'')}</span><p class="meta">${esc(m.date||m.createdAt||'')}</p>${m.subject?`<strong>${esc(m.subject)}</strong>`:''}<div class="body">${esc(m.message||m.body||'')}</div><div class="actions"><button data-read="${esc(m.id)}">Mark ${m.read?'unread':'read'}</button><button data-delete="${esc(m.id)}">Delete</button></div></article>`).join(''):'<div class="empty">No messages found. Contact-form messages will appear here only if the portfolio form saves them to this browser.</div>';$('list').querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{const m=messages.find(x=>String(x.id)===b.dataset.read);if(m){m.read=!m.read;save()}});$('list').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{messages=messages.filter(x=>String(x.id)!==b.dataset.delete);save()})}$('search').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{const blob=new Blob([JSON.stringify(messages,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mahir-elite-messages.json';a.click();URL.revokeObjectURL(a.href)};$('clear').onclick=()=>{if(confirm('Delete every locally saved message?')){messages=[];save()}};render();
</script><script src="shared-sync.js"></script>
</body></html>
